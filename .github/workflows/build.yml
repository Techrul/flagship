# Builds Flagship for every platform on GitHub's machines.
# - Runs on every push to main/beta (and by hand from the Actions tab); the files show up as downloadable artifacts.
# - Push a version tag like v0.4.0 (or v0.4.0-beta.1 for a beta) to build AND publish a GitHub Release.
name: Build

on:
  push:
    tags: ['v*']
    branches: [main, beta] # every push gets built and tested on all platforms
    paths-ignore: ['**.md'] # …except README-only changes
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one broken platform shouldn't hide the others' results
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            args: --linux --arm64
          - name: Windows (x64 + ARM64)
            os: windows-latest
            args: --win --x64 --arm64
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: --mac --universal

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $pkg. Bump the version first."
            exit 1
          fi

      - name: Linux packaging tools (rpm, pacman)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      # electron-builder's bundled fpm (used for .rpm/.pacman) is x64-only, so ARM uses the system one.
      - name: fpm for ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx tsc
      - run: npm test
      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No paid signing certificates (yet): don't go looking for them.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.tar.gz
            release/*.exe
            release/*.zip
            release/*.dmg

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a dash (v0.4.0-beta.1) are betas: marked as pre-releases, so stable users aren't offered them.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flagship $TAG" \
            --generate-notes \
            $pre

      # Preview of the package-manager files for this release (downloadable from the run page).
      - name: Render package-manager files
        run: node scripts/render-packages.mjs "${{ github.ref_name }}" files/SHA256SUMS.txt rendered
      - uses: actions/upload-artifact@v7
        with:
          name: package-manager-files
          path: rendered

  # ---------------- Package managers (stable releases only; betas skip all of this) ----------------

  scoop-homebrew-aur:
    name: Scoop + Homebrew (+ AUR)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      HAS_AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      # The Scoop bucket and Homebrew tap are read from main, so that's where their files go.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
      - run: node scripts/render-packages.mjs "$TAG" SHA256SUMS.txt . && rm SHA256SUMS.txt
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Casks packaging
          git diff --cached --quiet || git commit -m "Package managers: Flagship $TAG"
          git push origin HEAD:main

      - name: AUR (skipped until the AUR_SSH_PRIVATE_KEY secret is added)
        if: env.HAS_AUR != 'true'
        run: echo "::notice::AUR skipped. See README → Maintainer notes to set it up."
      - name: Publish flagship-bin to the AUR
        if: env.HAS_AUR == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: flagship-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Techrul
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}

  winget:
    name: winget
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: winget (skipped until the WINGET_TOKEN secret is added)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::winget skipped. See README → Maintainer notes to set it up."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Submit to microsoft/winget-pkgs
        if: env.HAS_TOKEN == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern SHA256SUMS.txt
          node scripts/render-packages.mjs $env:TAG SHA256SUMS.txt rendered
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $version = $env:TAG.TrimStart('v')
          # Opens a pull request from a fork under the token owner's account; Microsoft's bots validate it.
          .\wingetcreate.exe submit --prtitle "Techrul.Flagship version $version" --token $env:WINGET_TOKEN "rendered/packaging/winget/$version"
