# Builds Flagship for every platform on GitHub's machines.
# - Runs on every push to main/beta (and by hand from the Actions tab); the files show up as downloadable artifacts.
# - Push a version tag like v0.4.0 (or v0.4.0-beta.1 for a beta) to build AND publish a GitHub Release.
name: Build

on:
  push:
    tags: ['v*']
    branches: [main, beta] # every push gets built and tested on all platforms
    paths-ignore: ['**.md'] # …except README-only changes
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one broken platform shouldn't hide the others' results
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            args: --linux --arm64
          - name: Windows (x64 + ARM64)
            os: windows-latest
            args: --win --x64 --arm64
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: --mac --universal

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $pkg. Bump the version first."
            exit 1
          fi

      - name: Linux packaging tools (rpm, pacman)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      # electron-builder's bundled fpm (used for .rpm/.pacman) is x64-only, so ARM uses the system one.
      - name: fpm for ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx tsc
      - run: npm test
      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No paid signing certificates (yet): don't go looking for them.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.tar.gz
            release/*.exe
            release/*.zip
            release/*.dmg

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a dash (v0.4.0-beta.1) are betas: marked as pre-releases, so stable users aren't offered them.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flagship $TAG" \
            --generate-notes \
            $pre
